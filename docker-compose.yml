version: "3.8"
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    # environment:
    #   - MONGO_CONNECTION_STRING=
    #   - PORT=5000
    #   - SESSION_SECRET=

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      # so your React code can call the backend
      - REACT_APP_API_URL=http://backend:5000
    depends_on:
      - backend
